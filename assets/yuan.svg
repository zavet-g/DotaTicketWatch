<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338">

  <rect width="900" height="338" fill="#0a0a0a"/>

  <defs>
    <pattern id="scan" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="rgba(255,255,255,0.02)"/>
    </pattern>
    <style>
      .fg    { animation: fg   15s linear infinite }
      .draw  { animation: draw 15s linear infinite }
      .dots  { animation: dots 15s linear infinite }
      .pulse { animation: pls 2.4s ease-in-out infinite, dots 15s linear infinite }
      .glow  { animation: pls 2.4s ease-in-out infinite, dots 15s linear infinite }
      .hlne  { animation: hlne 15s linear infinite }
      .plbl  { animation: plbl 15s linear infinite }
      .meta  { animation: meta 15s linear infinite }

      .area  { animation: area 15s linear infinite }

      @keyframes fg   { 0%,5%  { opacity:0 } 10%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes meta { 0%,8%  { opacity:0 } 13%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes dots { 0%,35% { opacity:0 } 42%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes hlne { 0%,40% { opacity:0 } 46%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes plbl { 0%,44% { opacity:0 } 50%,72% { opacity:1 } 80%,100% { opacity:0 } }

      @keyframes area { 0%,38% { opacity:0 } 46%,72% { opacity:1 } 80%,100% { opacity:0 } }

      @keyframes draw {
        0%,10%  { stroke-dashoffset: 700; opacity: 0 }
        13%     { opacity: 1 }
        45%     { stroke-dashoffset: 0 }
        72%     { stroke-dashoffset: 0; opacity: 1 }
        80%,100%{ stroke-dashoffset: 0; opacity: 0 }
      }

      @keyframes pls {
        0%   { opacity: 0.5 }
        50%  { opacity: 1.0 }
        100% { opacity: 0.5 }
      }
    </style>
  </defs>

  <rect width="900" height="338" fill="url(#scan)"/>

  <!-- grid -->
  <g class="fg" opacity="0">
    <line x1="100" y1="72"  x2="800" y2="72"  stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="100" y1="116" x2="800" y2="116" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="100" y1="160" x2="800" y2="160" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="100" y1="204" x2="800" y2="204" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="100" y1="248" x2="800" y2="248" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="130" y1="55" x2="130" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="210" y1="55" x2="210" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="290" y1="55" x2="290" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="370" y1="55" x2="370" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="450" y1="55" x2="450" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="530" y1="55" x2="530" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="610" y1="55" x2="610" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="690" y1="55" x2="690" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
    <line x1="770" y1="55" x2="770" y2="270" stroke="#1e1e2a" stroke-width="0.5"/>
  </g>

  <!-- volume bars -->
  <g class="fg" opacity="0">
    <rect x="122" y="240" width="16" height="30" fill="#1a1a22"/>
    <rect x="202" y="255" width="16" height="15" fill="#1a1a22"/>
    <rect x="282" y="250" width="16" height="20" fill="#1a1a22"/>
    <rect x="362" y="252" width="16" height="18" fill="#1a1a22"/>
    <rect x="442" y="248" width="16" height="22" fill="#1a1a22"/>
    <rect x="522" y="241" width="16" height="29" fill="#1a1a22"/>
    <rect x="602" y="249" width="16" height="21" fill="#1a1a22"/>
    <rect x="682" y="245" width="16" height="25" fill="#1a1a22"/>
    <rect x="762" y="259" width="16" height="11" fill="#1a1a22"/>
  </g>

  <!-- price axis -->
  <g class="meta" opacity="0">
    <text x="812" y="76"  font-family="monospace" font-size="9" fill="#3a3a3a">11.74</text>
    <text x="812" y="164" font-family="monospace" font-size="9" fill="#3a3a3a">11.50</text>
    <text x="812" y="252" font-family="monospace" font-size="9" fill="#3a3a3a">11.24</text>
  </g>

  <!-- day labels -->
  <g class="meta" opacity="0">
    <text x="130" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">пн</text>
    <text x="210" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">вт</text>
    <text x="290" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">ср</text>
    <text x="370" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">чт</text>
    <text x="450" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">пн</text>
    <text x="530" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">вт</text>
    <text x="610" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">ср</text>
    <text x="690" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">чт</text>
    <text x="770" y="288" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">пт</text>
  </g>

  <!-- area fill under price line -->
  <polygon class="area"
    points="130,72 210,94 290,116 370,158 450,166 530,197 610,174 690,230 770,248 770,270 130,270"
    fill="rgba(120,120,180,0.06)" opacity="0"/>

  <!-- price line shadow -->
  <polyline class="draw"
    points="130,74 210,96 290,118 370,160 450,168 530,199 610,176 690,232 770,250"
    fill="none" stroke="#22223a" stroke-width="4"
    stroke-dasharray="700" stroke-dashoffset="700"
    stroke-linejoin="round" stroke-linecap="round" opacity="0"/>

  <!-- price line -->
  <polyline class="draw"
    points="130,72 210,94 290,116 370,158 450,166 530,197 610,174 690,230 770,248"
    fill="none" stroke="#777" stroke-width="1.5"
    stroke-dasharray="700" stroke-dashoffset="700"
    stroke-linejoin="round" stroke-linecap="round" opacity="0"/>

  <!-- data points -->
  <g class="dots" opacity="0">
    <circle cx="130" cy="72"  r="2" fill="#777"/>
    <circle cx="210" cy="94"  r="2" fill="#777"/>
    <circle cx="290" cy="116" r="2" fill="#777"/>
    <circle cx="370" cy="158" r="2" fill="#777"/>
    <circle cx="450" cy="166" r="2" fill="#777"/>
    <circle cx="530" cy="197" r="2" fill="#777"/>
    <circle cx="610" cy="174" r="2" fill="#777"/>
    <circle cx="690" cy="230" r="2" fill="#777"/>
  </g>

  <!-- current price horizontal indicator -->
  <line class="hlne" x1="100" y1="248" x2="770" y2="248"
    stroke="#3a3a45" stroke-width="0.5" stroke-dasharray="4,4" opacity="0"/>

  <!-- current price glow -->
  <circle class="glow" cx="770" cy="248" r="20" fill="rgba(160,160,210,0.04)" opacity="0"/>
  <circle class="glow" cx="770" cy="248" r="12" fill="rgba(160,160,210,0.08)" opacity="0"/>
  <circle class="glow" cx="770" cy="248" r="6"  fill="rgba(180,180,220,0.14)" opacity="0"/>

  <!-- current price dot -->
  <circle class="pulse" cx="770" cy="248" r="3.5" fill="#ccc" opacity="0"/>

  <!-- current price label -->
  <text class="plbl" x="788" y="252" font-family="monospace" font-size="12" font-weight="bold" fill="#888" opacity="0">11.25</text>

  <!-- corner meta -->
  <text class="meta" x="20"  y="22"  font-family="monospace" font-size="11" fill="#444" opacity="0">&#x25B8; почём юань</text>
  <text class="meta" x="656" y="22"  font-family="monospace" font-size="11" fill="#444" opacity="0">CNYRUB_TOM &#xB7; MOEX ISS</text>
  <text class="meta" x="20"  y="328" font-family="monospace" font-size="11" fill="#444" opacity="0">¥ &#x2192; ₽ &#xB7; биржевой курс</text>
  <text class="meta" x="790" y="328" font-family="monospace" font-size="10" fill="#333" opacity="0">московская биржа</text>

</svg>
