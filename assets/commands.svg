<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 263" width="900" height="263">

  <rect width="900" height="263" fill="#000"/>

  <defs>
    <pattern id="scan" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="rgba(255,255,255,0.022)"/>
    </pattern>
    <style>
      .c1     { animation: cmd1    12s linear infinite }
      .c2     { animation: cmd2    12s linear infinite }
      .c3     { animation: cmd3    12s linear infinite }
      .c4     { animation: cmd4    12s linear infinite }
      .c5     { animation: cmd5    12s linear infinite }
      .c6     { animation: cmd6    12s linear infinite }
      .cdiv   { animation: cdiv   12s linear infinite }
      .c7     { animation: cmd7   12s linear infinite }
      .c8     { animation: cmd8   12s linear infinite }
      .note   { animation: cnote  12s linear infinite }

      @keyframes cmd1  { 0%,3%  { opacity:0 } 8%,62%  { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd2  { 0%,8%  { opacity:0 } 13%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd3  { 0%,13% { opacity:0 } 18%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd4  { 0%,18% { opacity:0 } 23%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd5  { 0%,23% { opacity:0 } 28%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd6  { 0%,28% { opacity:0 } 33%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cdiv  { 0%,33% { opacity:0 } 37%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd7  { 0%,37% { opacity:0 } 42%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cmd8  { 0%,42% { opacity:0 } 47%,62% { opacity:1 } 70%,100% { opacity:0 } }
      @keyframes cnote { 0%,50% { opacity:0 } 55%,62% { opacity:1 } 70%,100% { opacity:0 } }
    </style>
  </defs>

  <rect width="900" height="263" fill="url(#scan)"/>

  <!-- left edge mark -->
  <line x1="32" y1="14" x2="32" y2="249" stroke="#111" stroke-width="1"/>

  <!-- /start -->
  <text class="c1" x="46" y="42" font-family="monospace" font-size="12">
    <tspan fill="#555">/start   </tspan><tspan fill="#3a3a3a">—  подписаться на уведомления</tspan>
  </text>

  <!-- /stop -->
  <text class="c2" x="46" y="64" font-family="monospace" font-size="12">
    <tspan fill="#555">/stop    </tspan><tspan fill="#3a3a3a">—  отписаться</tspan>
  </text>

  <!-- /flight -->
  <text class="c3" x="46" y="86" font-family="monospace" font-size="12">
    <tspan fill="#555">/flight  </tspan><tspan fill="#3a3a3a">—  перелёт в шанхай</tspan>
  </text>

  <!-- /yuan -->
  <text class="c4" x="46" y="108" font-family="monospace" font-size="12">
    <tspan fill="#555">/yuan    </tspan><tspan fill="#3a3a3a">—  курс юаня</tspan>
  </text>

  <!-- /weather -->
  <text class="c5" x="46" y="130" font-family="monospace" font-size="12">
    <tspan fill="#555">/weather </tspan><tspan fill="#3a3a3a">—  погода в шанхае</tspan>
  </text>

  <!-- /faq -->
  <text class="c6" x="46" y="152" font-family="monospace" font-size="12">
    <tspan fill="#555">/faq     </tspan><tspan fill="#3a3a3a">—  познать истину</tspan>
  </text>

  <!-- divider -->
  <text class="cdiv" x="46" y="170" font-family="monospace" font-size="11" fill="#1c1c1c">─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─  ─</text>

  <!-- /check -->
  <text class="c7" x="46" y="192" font-family="monospace" font-size="12">
    <tspan fill="#666">/check   </tspan><tspan fill="#444">—  проверить вручную</tspan>
  </text>
  <text class="c7" x="780" y="192" font-family="monospace" font-size="11" fill="#282828">admin</text>

  <!-- /status -->
  <text class="c8" x="46" y="214" font-family="monospace" font-size="12">
    <tspan fill="#666">/status  </tspan><tspan fill="#444">—  статус системы · uptime · poll · юань · погода</tspan>
  </text>
  <text class="c8" x="780" y="214" font-family="monospace" font-size="11" fill="#282828">admin</text>

  <!-- note -->
  <text class="note" x="46" y="243" font-family="monospace" font-size="11" fill="#1e1e1e">admin команды видны только тебе · scoped через setMyCommands · chat_id</text>

</svg>
