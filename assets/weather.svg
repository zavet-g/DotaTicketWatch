<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338">

  <rect width="900" height="338" fill="#0a0a0a"/>

  <defs>
    <pattern id="scan" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" fill="rgba(255,255,255,0.02)"/>
    </pattern>
    <style>
      .fg   { animation: fg   16s linear infinite }
      .meta { animation: meta 16s linear infinite }
      .b1   { animation: bar1 16s linear infinite }
      .b2   { animation: bar2 16s linear infinite }
      .b3   { animation: bar3 16s linear infinite }
      .b4   { animation: bar4 16s linear infinite }
      .b5   { animation: bar5 16s linear infinite }
      .b6   { animation: bar6 16s linear infinite }
      .b7   { animation: bar7 16s linear infinite }
      .b8   { animation: bar8 16s linear infinite }
      .b9   { animation: bar9 16s linear infinite }
      .b10  { animation: bar10 16s linear infinite }
      .lbl  { animation: lbl 16s linear infinite }
      .conn { animation: conn 16s linear infinite }
      .pls  { animation: pls 2.4s ease-in-out infinite }

      @keyframes fg    { 0%,4%  { opacity:0 } 8%,72%  { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes meta  { 0%,6%  { opacity:0 } 11%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes bar1  { 0%,10% { opacity:0; transform:scaleY(0) } 14%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar2  { 0%,13% { opacity:0; transform:scaleY(0) } 17%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar3  { 0%,16% { opacity:0; transform:scaleY(0) } 20%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar4  { 0%,19% { opacity:0; transform:scaleY(0) } 23%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar5  { 0%,22% { opacity:0; transform:scaleY(0) } 26%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar6  { 0%,25% { opacity:0; transform:scaleY(0) } 29%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar7  { 0%,28% { opacity:0; transform:scaleY(0) } 32%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar8  { 0%,31% { opacity:0; transform:scaleY(0) } 35%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar9  { 0%,34% { opacity:0; transform:scaleY(0) } 38%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes bar10 { 0%,37% { opacity:0; transform:scaleY(0) } 41%,72% { opacity:1; transform:scaleY(1) } 80%,100% { opacity:0; transform:scaleY(1) } }
      @keyframes lbl   { 0%,42% { opacity:0 } 47%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes conn  { 0%,41% { opacity:0 } 46%,72% { opacity:1 } 80%,100% { opacity:0 } }
      @keyframes pls   { 0% { opacity:0.5 } 50% { opacity:1 } 100% { opacity:0.5 } }
    </style>
  </defs>

  <rect width="900" height="338" fill="url(#scan)"/>

  <!-- horizontal grid lines (temperature scale) -->
  <g class="fg" opacity="0">
    <line x1="100" y1="60"  x2="820" y2="60"  stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="100" y1="105" x2="820" y2="105" stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="100" y1="150" x2="820" y2="150" stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="100" y1="195" x2="820" y2="195" stroke="#1a1a24" stroke-width="0.5"/>
    <line x1="100" y1="240" x2="820" y2="240" stroke="#1a1a24" stroke-width="0.5"/>
  </g>

  <!-- temperature scale labels (left) -->
  <g class="meta" opacity="0">
    <text x="80" y="64"  font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="end">35°</text>
    <text x="80" y="109" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="end">28°</text>
    <text x="80" y="154" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="end">21°</text>
    <text x="80" y="199" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="end">14°</text>
    <text x="80" y="244" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="end">7°</text>
  </g>

  <!--
    10 days of real Shanghai April data:
    day1: 16-25  day2: 13-18  day3: 13-15  day4: 15-20  day5: 15-20
    day6: 13-20  day7: 15-21  day8: 14-24  day9: 13-22  day10: 13-23

    scale: 7° = y:240, 35° = y:60  → per degree = (240-60)/(35-7) = 6.43px
    y = 240 - (temp - 7) * 6.43
  -->

  <!-- temperature range bars — each bar is min→max, grow from center -->

  <!-- day 1 (today): 16-25° — highlighted -->
  <rect class="b1" x="128" y="105" width="28" height="58" rx="3" fill="#3a3a50" transform-origin="142 134" opacity="0"/>
  <rect class="b1" x="131" y="108" width="22" height="52" rx="2" fill="#4a4a65" transform-origin="142 134" opacity="0"/>
  <!-- today pulsing edges -->
  <rect class="b1 pls" x="128" y="105" width="28" height="58" rx="3" fill="none" stroke="#5a5a80" stroke-width="0.8" transform-origin="142 134" opacity="0"/>

  <!-- day 2: 13-18° -->
  <rect class="b2" x="198" y="149" width="28" height="32" rx="3" fill="#2a2a38" transform-origin="212 165" opacity="0"/>
  <rect class="b2" x="201" y="152" width="22" height="26" rx="2" fill="#333345" transform-origin="212 165" opacity="0"/>

  <!-- day 3: 13-15° -->
  <rect class="b3" x="268" y="181" width="28" height="13" rx="3" fill="#2a2a38" transform-origin="282 188" opacity="0"/>
  <rect class="b3" x="271" y="184" width="22" height="7"  rx="2" fill="#333345" transform-origin="282 188" opacity="0"/>

  <!-- day 4: 15-20° -->
  <rect class="b4" x="338" y="143" width="28" height="39" rx="3" fill="#2a2a38" transform-origin="352 162" opacity="0"/>
  <rect class="b4" x="341" y="146" width="22" height="33" rx="2" fill="#333345" transform-origin="352 162" opacity="0"/>

  <!-- day 5: 15-20° -->
  <rect class="b5" x="408" y="143" width="28" height="39" rx="3" fill="#2a2a38" transform-origin="422 162" opacity="0"/>
  <rect class="b5" x="411" y="146" width="22" height="33" rx="2" fill="#333345" transform-origin="422 162" opacity="0"/>

  <!-- day 6: 13-20° -->
  <rect class="b6" x="478" y="143" width="28" height="52" rx="3" fill="#2a2a38" transform-origin="492 169" opacity="0"/>
  <rect class="b6" x="481" y="146" width="22" height="46" rx="2" fill="#333345" transform-origin="492 169" opacity="0"/>

  <!-- day 7: 15-21° -->
  <rect class="b7" x="548" y="137" width="28" height="45" rx="3" fill="#2a2a38" transform-origin="562 159" opacity="0"/>
  <rect class="b7" x="551" y="140" width="22" height="39" rx="2" fill="#333345" transform-origin="562 159" opacity="0"/>

  <!-- day 8: 14-24° -->
  <rect class="b8" x="618" y="111" width="28" height="65" rx="3" fill="#2a2a38" transform-origin="632 143" opacity="0"/>
  <rect class="b8" x="621" y="114" width="22" height="59" rx="2" fill="#333345" transform-origin="632 143" opacity="0"/>

  <!-- day 9: 13-22° -->
  <rect class="b9" x="688" y="124" width="28" height="71" rx="3" fill="#2a2a38" transform-origin="702 159" opacity="0"/>
  <rect class="b9" x="691" y="127" width="22" height="65" rx="2" fill="#333345" transform-origin="702 159" opacity="0"/>

  <!-- day 10: 13-23° -->
  <rect class="b10" x="758" y="117" width="28" height="78" rx="3" fill="#2a2a38" transform-origin="772 156" opacity="0"/>
  <rect class="b10" x="761" y="120" width="22" height="72" rx="2" fill="#333345" transform-origin="772 156" opacity="0"/>

  <!-- max temp connector line (top of each bar) -->
  <polyline class="conn"
    points="142,105 212,149 282,181 352,143 422,143 492,143 562,137 632,111 702,124 772,117"
    fill="none" stroke="#555" stroke-width="0.8" stroke-dasharray="2,4" opacity="0"/>

  <!-- min temp connector line (bottom of each bar) -->
  <polyline class="conn"
    points="142,163 212,181 282,194 352,182 422,182 492,195 562,182 632,176 702,195 772,195"
    fill="none" stroke="#444" stroke-width="0.8" stroke-dasharray="2,4" opacity="0"/>

  <!-- precipitation markers (▸ for >60%) -->
  <g class="lbl" opacity="0">
    <text x="142" y="270" font-family="monospace" font-size="9" fill="#5a5a80" text-anchor="middle">▸</text>
    <text x="212" y="270" font-family="monospace" font-size="9" fill="#5a5a80" text-anchor="middle">▸</text>
  </g>

  <!-- day labels -->
  <g class="lbl" opacity="0">
    <text x="142" y="284" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">сег</text>
    <text x="212" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">сб</text>
    <text x="282" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">вс</text>
    <text x="352" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">пн</text>
    <text x="422" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">вт</text>
    <text x="492" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">ср</text>
    <text x="562" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">чт</text>
    <text x="632" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">пт</text>
    <text x="702" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">сб</text>
    <text x="772" y="284" font-family="monospace" font-size="9" fill="#3a3a3a" text-anchor="middle">вс</text>
  </g>

  <!-- today temperature labels -->
  <g class="lbl" opacity="0">
    <text x="142" y="99" font-family="monospace" font-size="10" font-weight="bold" fill="#888" text-anchor="middle">25°</text>
    <text x="142" y="177" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">16°</text>
  </g>

  <!-- corner meta -->
  <text class="meta" x="20"  y="22"  font-family="monospace" font-size="11" fill="#444" opacity="0">&#x25B8; небо над ареной</text>
  <text class="meta" x="690" y="22"  font-family="monospace" font-size="11" fill="#444" opacity="0">31.17°N 121.47°E</text>
  <text class="meta" x="20"  y="328" font-family="monospace" font-size="11" fill="#444" opacity="0">шанхай · 10 дней · min–max</text>
  <text class="meta" x="793" y="328" font-family="monospace" font-size="10" fill="#333" opacity="0">open-meteo</text>

</svg>
