services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    depends_on:
      flaresolverr:
        condition: service_healthy
        required: false

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    init: true
    shm_size: 2g
    mem_limit: 2g
    profiles:
      - flaresolverr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health || kill 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30

networks:
  default:
    name: dotaticketwatch_default
    ipam:
      config:
        - subnet: 172.28.0.0/24
