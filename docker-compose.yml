services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    depends_on:
      flaresolverr:
        condition: service_healthy
        required: false

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    init: true
    mem_limit: 1g
    profiles:
      - flaresolverr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
